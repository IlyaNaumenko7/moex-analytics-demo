name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Format check (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 .

      - name: Type check (mypy)
        run: mypy src

      - name: Tests (pytest)
        run: pytest -q